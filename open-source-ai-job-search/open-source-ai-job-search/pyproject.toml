[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-source-ai-job-search"
version = "0.1.0"
description = "Local-first AI job discovery, matching, drafting, and tracking workflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Open Source AI Job Search Contributors" }
]
dependencies = []

[project.optional-dependencies]
documents = [
  "pypdf>=5,<7",
  "python-docx>=1.1,<2"
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1"
]
dashboard = [
  "streamlit>=1.44,<2",
  "pandas>=2.2,<4"
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1"
]
all = [
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "streamlit>=1.44,<2",
  "pandas>=2.2,<4"
]

[project.scripts]
jobsearch = "jobsearch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
